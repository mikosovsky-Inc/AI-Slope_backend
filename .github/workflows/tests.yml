name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python 3.12, PostgreSQL 17, Redis, SeaweedFS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_slop_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ai_slop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_slop_test -d ai_slop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      seaweedfs:
        image: chrislusf/seaweedfs:4.47
        env:
          AWS_ACCESS_KEY_ID: ci-access
          AWS_SECRET_ACCESS_KEY: ci-secret
          S3_BUCKET: ai-slop-test
        ports:
          - 8333:8333

    env:
      TEST_S3_ENDPOINT_URL: http://localhost:8333
      TEST_S3_BUCKET: ai-slop-test
      TEST_S3_ACCESS_KEY_ID: ci-access
      TEST_S3_SECRET_ACCESS_KEY: ci-secret
      TEST_REDIS_URL: redis://localhost:6379/15
      # Credentials are only for the temporary CI database.
      TEST_DATABASE_URL: postgresql+psycopg://ai_slop_test:ci_only_password@localhost:5432/ai_slop_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies from lockfile
        run: uv sync --locked --dev

      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Run unit and integration tests
        run: uv run --no-sync pytest -ra
