[project]
name = "ai-slop-backend"
version = "0.1.0"
description = "API for short video generation and publishing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlmodel>=0.0.22,<0.1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pyjwt>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "redis>=6,<8",
    "httpx>=0.27,<1",
    "openai>=2,<3",
    "boto3>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
