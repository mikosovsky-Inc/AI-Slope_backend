services:
  api:
    build: .
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:${S3_PORT:-8333}}
      S3_BUCKET: ${S3_BUCKET:-ai-slop}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ai-slop-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ai-slop-local-secret}
      S3_URL_SECONDS: ${S3_URL_SECONDS:-300}
      S3_TIMEOUT_SECONDS: ${S3_TIMEOUT_SECONDS:-10}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-104857600}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      JWT_ISSUER: ${JWT_ISSUER:-ai-slop-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-slop-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EXTERNAL_PROVIDERS_MODE: ${EXTERNAL_PROVIDERS_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      DIRECTOR_IMAGE_ESTIMATE_USD: ${DIRECTOR_IMAGE_ESTIMATE_USD:-0.005}
      DIRECTOR_VIDEO_SECOND_ESTIMATE_USD: ${DIRECTOR_VIDEO_SECOND_ESTIMATE_USD:-0.01}
      DIRECTOR_VISUAL_BUDGET_FRACTION: ${DIRECTOR_VISUAL_BUDGET_FRACTION:-0.5}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10).read()"]
      interval: 10s
      timeout: 12s
      retries: 3
      start_period: 20s
    init: true
    stop_grace_period: 20s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ai-slop-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ai-slop-local-secret}
      S3_BUCKET: ${S3_BUCKET:-ai-slop}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data

volumes:
  seaweedfs_data:
  postgres_data:
  redis_data:
