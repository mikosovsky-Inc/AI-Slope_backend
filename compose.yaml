services:
  api:
    build: .
    environment: &backend_environment
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-100}
      SCHEDULER_MAX_IDEA_BATCHES_PER_DAY: ${SCHEDULER_MAX_IDEA_BATCHES_PER_DAY:-2}
      TASKS_EAGER: "false"
      TASK_DISPATCH_INTERVAL_SECONDS: ${TASK_DISPATCH_INTERVAL_SECONDS:-2}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:${S3_PORT:-8333}}
      S3_BUCKET: ${S3_BUCKET:-ai-slop}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ai-slop-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ai-slop-local-secret}
      S3_URL_SECONDS: ${S3_URL_SECONDS:-300}
      S3_TIMEOUT_SECONDS: ${S3_TIMEOUT_SECONDS:-10}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-600}
      QUALITY_DURATION_TOLERANCE_SECONDS: ${QUALITY_DURATION_TOLERANCE_SECONDS:-1.0}
      QUALITY_MAX_SCENE_RETRIES: ${QUALITY_MAX_SCENE_RETRIES:-2}
      QUALITY_TIMEOUT_SECONDS: ${QUALITY_TIMEOUT_SECONDS:-180}
      QUALITY_REPAIR_TIMEOUT_SECONDS: ${QUALITY_REPAIR_TIMEOUT_SECONDS:-3600}
      RENDER_THREADS: ${RENDER_THREADS:-2}
      RENDER_MAX_INPUT_BYTES: ${RENDER_MAX_INPUT_BYTES:-536870912}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-104857600}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      JWT_ISSUER: ${JWT_ISSUER:-ai-slop-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-slop-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      EXTERNAL_PROVIDERS_MODE: ${EXTERNAL_PROVIDERS_MODE:-mock}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-60}
      ELEVENLABS_MAX_RESPONSE_BYTES: ${ELEVENLABS_MAX_RESPONSE_BYTES:-16777216}
      ELEVENLABS_SEND_LANGUAGE_CODE: ${ELEVENLABS_SEND_LANGUAGE_CODE:-true}
      TTS_USD_PER_1000_CHARACTERS: ${TTS_USD_PER_1000_CHARACTERS:-null}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_IMAGE_ENDPOINT_ID: ${RUNPOD_IMAGE_ENDPOINT_ID:-}
      RUNPOD_VIDEO_ENDPOINT_ID: ${RUNPOD_VIDEO_ENDPOINT_ID:-}
      RUNPOD_IMAGE_MODEL: ${RUNPOD_IMAGE_MODEL:-}
      RUNPOD_VIDEO_MODEL: ${RUNPOD_VIDEO_MODEL:-}
      RUNPOD_TIMEOUT_SECONDS: ${RUNPOD_TIMEOUT_SECONDS:-20}
      RUNPOD_STATUS_MAX_RETRIES: ${RUNPOD_STATUS_MAX_RETRIES:-2}
      RUNPOD_EXECUTION_TIMEOUT_MS: ${RUNPOD_EXECUTION_TIMEOUT_MS:-600000}
      RUNPOD_JOB_TTL_MS: ${RUNPOD_JOB_TTL_MS:-3600000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      LLM_REQUEST_ESTIMATE_USD: ${LLM_REQUEST_ESTIMATE_USD:-null}
      DIRECTOR_IMAGE_ESTIMATE_USD: ${DIRECTOR_IMAGE_ESTIMATE_USD:-0.005}
      DIRECTOR_VIDEO_SECOND_ESTIMATE_USD: ${DIRECTOR_VIDEO_SECOND_ESTIMATE_USD:-0.01}
      DIRECTOR_VISUAL_BUDGET_FRACTION: ${DIRECTOR_VISUAL_BUDGET_FRACTION:-0.5}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10).read()"]
      interval: 10s
      timeout: 12s
      retries: 3
      start_period: 20s
    init: true
    stop_grace_period: 20s

  worker:
    build: .
    entrypoint: []
    command: ["dramatiq", "app.workers.actors", "--processes", "1", "--threads", "4"]
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 130s

  dispatcher:
    build: .
    entrypoint: []
    command: ["python", "-m", "app.workers.dispatcher"]
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

  scheduler:
    build: .
    entrypoint: []
    command: ["python", "-m", "app.workers.scheduler"]
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

  monitoring-init:
    profiles: [monitoring]
    build: .
    user: "0:0"
    entrypoint: []
    command: ["python", "-m", "app.modules.observability.configure_prometheus"]
    environment: *backend_environment
    volumes:
      - prometheus_credentials:/credentials

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.13.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=1GB"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_credentials:/credentials:ro
      - prometheus_data:/prometheus
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ai-slop-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ai-slop-local-secret}
      S3_BUCKET: ${S3_BUCKET:-ai-slop}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data

volumes:
  prometheus_credentials:
  prometheus_data:
  seaweedfs_data:
  postgres_data:
  redis_data:
